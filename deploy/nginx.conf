# MebeliX Kroy — web: statik frontend + /api → api:8000
server {
    listen 80;
    server_name _;
    client_max_body_size 64m;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml text/plain;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
    location = /docs { proxy_pass http://api:8000; }
    location = /openapi.json { proxy_pass http://api:8000; }

    root /usr/share/nginx/html;
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
