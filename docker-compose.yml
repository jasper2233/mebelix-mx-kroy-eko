# MebeliX Kroy: db (PostgreSQL) + api (FastAPI) + web (nginx).  Ishga tushirish:  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mebelix
      POSTGRES_USER: mebelix
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mebelix}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mebelix -d mebelix"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      MEBELIX_DB_URL: postgresql+psycopg://mebelix:${DB_PASSWORD:-mebelix}@db:5432/mebelix
      # MES integratsiyasi (ixtiyoriy):
      MES_WEBHOOK_URL: ${MES_WEBHOOK_URL:-}
      MES_WEBHOOK_TOKEN: ${MES_WEBHOOK_TOKEN:-}
      # MES SSO (JWT) — yoqish uchun: MEBELIX_AUTH_REQUIRED=1 va kalit
      MEBELIX_AUTH_REQUIRED: ${MEBELIX_AUTH_REQUIRED:-0}
      MEBELIX_JWT_SECRET: ${MEBELIX_JWT_SECRET:-}
      MEBELIX_JWT_PUBLIC_KEY: ${MEBELIX_JWT_PUBLIC_KEY:-}
      MEBELIX_DEFAULT_USER: ${MEBELIX_DEFAULT_USER:-admin}
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  dbdata:
